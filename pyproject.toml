[project]
name = "attention-calculator"
version = "0.1.0"
description = "Reproduction of zhuyidao.net 注意力计算器: automatic integral proofs for constant-vs-rational inequalities"
readme = "README.md"
requires-python = ">=3.13"                                                                                           # ast.dump(show_empty=) 3.13 才有
dependencies = ["sympy>=1.13", "mpmath>=1.3", "flask>=3.0", "waitress>=3.0"]

[project.scripts]
attention-calculator = "attention_calculator.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_calculator"]
# /demo 的 CDN 前端副本是 fetch-vendor-assets.sh 拉取的下载产物，不进 wheel
exclude = ["src/attention_calculator/static/vendor/**"]

[tool.uv]
# CI 与本机钉同一 uv 版本——不同版本解析结果不同，uv lock --check 会假失败
required-version = "==0.11.29"

[[tool.uv.index]]
# 与本机 UV_DEFAULT_INDEX 环境变量同源——不一致会让 uv 认为 lockfile 过期
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 全角标点（，；""）是站端逐字串/中文注释的内容数据，"修正"会篡改 parity 证据
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
