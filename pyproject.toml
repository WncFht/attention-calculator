[project]
name = "attention-calculator"
version = "0.1.0"
description = "Reproduction of zhuyidao.net 注意力计算器: automatic integral proofs for constant-vs-rational inequalities"
requires-python = ">=3.11"
dependencies = [
  "sympy>=1.13",
  "mpmath>=1.3",
  "flask>=3.0",
  "waitress>=3.0",
  "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attention_calculator"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 全角标点（，；""）是站端逐字串/中文注释的内容数据，"修正"会篡改 parity 证据
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
