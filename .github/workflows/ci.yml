name: CI

on:
  push:
    branches: [main]
  pull_request:

# 与 pre-commit 同源：本地不过 CI 必挂。本文件是通用 base——format 门控
# （prettier check + markdownlint），每个仓库都有。
# 其他文件类型的 CI job/steps 按 census 结果从 skill 的
# references/recipes.md 逐卡追加到 jobs: 下（缩进两级）。
# ubuntu-latest 不预装 brew：lint 工具统一钉与本地同版本的官方 release
# 二进制，装进 $RUNNER_TEMP/toolbin（经 $GITHUB_PATH 进 PATH，免 sudo）。
jobs:
  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks git 扫全量历史

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Install linters
        run: |
          bin="$RUNNER_TEMP/toolbin"
          mkdir -p "$bin" && echo "$bin" >> "$GITHUB_PATH"
          curl -sSfL https://github.com/huacnlee/autocorrect/releases/download/v2.16.3/autocorrect-linux-amd64.tar.gz | tar -xz -C "$bin" autocorrect
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$bin" gitleaks
          curl -sSfL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz | gzip -dc > "$bin/taplo" && chmod +x "$bin/taplo"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$bin" actionlint

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md

      - name: Autocorrect lint
        run: git ls-files -z '*.md' | xargs -0 autocorrect --lint

      - name: Secrets scan
        run: gitleaks git --redact .

      - name: Toml & workflows check
        run: |
          git ls-files -z '*.toml' | xargs -0 taplo fmt --check
          actionlint

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt + shellcheck
        run: |
          bin="$RUNNER_TEMP/toolbin"
          mkdir -p "$bin" && echo "$bin" >> "$GITHUB_PATH"
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 -o "$bin/shfmt" && chmod +x "$bin/shfmt"
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
      - run: |
          for f in $(git ls-files '*.sh'); do
            head -1 "$f" | grep -q "zsh" || shfmt -d -i 2 "$f"
            head -1 "$f" | grep -q "zsh" || shellcheck -S warning "$f"
          done

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff==0.16.7
      - run: ruff format --check . && ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest
