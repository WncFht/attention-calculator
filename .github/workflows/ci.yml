name: CI

on:
  push:
    branches: [main]
  pull_request:

# 与 pre-commit 同源：本地不过 CI 必挂。本文件是通用 base——format 门控
# （prettier check + markdownlint），每个仓库都有。
# 其他文件类型的 CI job/steps 按 census 结果从 skill 的
# references/recipes.md 逐卡追加到 jobs: 下（缩进两级）。
jobs:
  format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks git 扫全量历史

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint:md

      - name: Autocorrect lint
        run: |
          brew install autocorrect
          git ls-files -z '*.md' | xargs -0 autocorrect --lint

      - name: Secrets scan
        run: |
          brew install gitleaks
          gitleaks git --redact .

      - name: Toml & workflows check
        run: |
          brew install taplo actionlint
          git ls-files -z '*.toml' | xargs -0 taplo fmt --check
          actionlint

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install shfmt shellcheck
      - run: |
          for f in $(git ls-files '*.sh'); do
            head -1 "$f" | grep -q "zsh" || shfmt -d -i 2 "$f"
            head -1 "$f" | grep -q "zsh" || shellcheck -S warning "$f"
          done

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ruff
      - run: ruff format --check . && ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest
